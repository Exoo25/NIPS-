<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NIPS STUDENT PORTAL - Coming Soon</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial, Helvetica, sans-serif;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
overflow:hidden;
text-align:center;
color:white;

/* animated gradient */
background:linear-gradient(-45deg,#0057ff,#0099ff,#ffd000,#ffea70);
background-size:400% 400%;
animation:gradientMove 12s ease infinite;
}

@keyframes gradientMove{
0%{background-position:0% 50%}
50%{background-position:100% 50%}
100%{background-position:0% 50%}
}

/* floating background circles */

.circle{
position:absolute;
border-radius:50%;
background:rgba(255,255,255,0.15);
backdrop-filter:blur(5px);
animation:float 20s linear infinite;
}

.circle:nth-child(1){
width:200px;
height:200px;
left:10%;
top:80%;
animation-duration:25s;
}

.circle:nth-child(2){
width:150px;
height:150px;
left:70%;
top:90%;
animation-duration:18s;
}

.circle:nth-child(3){
width:120px;
height:120px;
left:50%;
top:85%;
animation-duration:22s;
}

@keyframes float{
0%{transform:translateY(0)}
100%{transform:translateY(-120vh)}
}

/* glass card */

.container{
padding:40px;
border-radius:18px;
background:rgba(255,255,255,0.1);
backdrop-filter:blur(10px);
box-shadow:0 10px 30px rgba(0,0,0,0.25);
}

/* header */

header{
font-size:clamp(1.8rem,5vw,3.2rem);
font-weight:bold;
letter-spacing:2px;
margin-bottom:20px;
}

/* animated coming soon */

.coming-soon{
font-size:clamp(1.5rem,4vw,2.2rem);
color:#007bff;
background:rgba(255,255,255,0.15);
padding:12px 26px;
border-radius:12px;
display:inline-block;
animation:pulse 2s infinite;
}

@keyframes pulse{
0%{transform:scale(1);box-shadow:0 0 0px rgba(0,0,0,0)}
50%{transform:scale(1.08);box-shadow:0 0 25px rgba(255,255,255,0.4)}
100%{transform:scale(1)}
}

/* footer */

footer{
position:absolute;
bottom:15px;
font-size:0.9rem;
opacity:0.9;
width:100%;
}

/* mobile spacing */

@media (max-width:600px){

.container{
padding:30px 20px;
}

footer{
font-size:0.8rem;
}

}

</style>
</head>

<body>

<div class="circle"></div>
<div class="circle"></div>
<div class="circle"></div>

<div class="container">
<header>NIPS STUDENT PORTAL</header>
<div class="coming-soon">Coming Soon</div>
</div>

<footer>© 2026 NIPS. All rights reserved.</footer>

</body>
</html>
